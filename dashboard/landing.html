<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabian</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:  #050c1a;
      --edge:  #152040;
      --edge2: #1e2f50;
      --dim:   #8aa0c0;
      --text:  #c8d8f0;
      --mono: 'Courier New', Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--navy);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2.5rem;
      flex-shrink: 0;
    }

    .logo {
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-decoration: none;
      text-transform: uppercase;
      line-height: 1;
    }
    .logo .lg { color: #1a6fff; }
    .logo .lw { color: #ffffff; }

    .nav-entry {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--edge2);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-entry:hover { color: var(--dim); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 2.5rem;
    }

    .scores {
      display: flex;
      gap: 4rem;
      flex-wrap: wrap;
    }

    .s-cell {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .s-country {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--edge2);
    }

    .s-num {
      font-family: var(--mono);
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    footer {
      padding: 1.5rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      flex-shrink: 0;
      border-top: 1px solid var(--edge);
    }

    .f-left {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--edge2);
    }

    .f-mail {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      color: var(--edge2);
      text-decoration: none;
      transition: color 0.2s;
    }
    .f-mail:hover { color: var(--dim); }

    @media (max-width: 600px) {
      nav, footer { padding: 1.25rem; }
      main { padding: 0 1.25rem; }
      .scores { gap: 2.5rem; }
      .s-num { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="/">
    <span class="lg">S</span><span class="lw">A</span><span class="lg">B</span><span class="lw">I</span><span class="lg">AN</span>
  </a>
  <a class="nav-entry" href="/terminal">Terminal →</a>
</nav>

<main>
  <div class="scores" id="scores">
    <div class="s-cell"><div class="s-country">Sudan</div><div class="s-num">94</div></div>
    <div class="s-cell"><div class="s-country">Myanmar</div><div class="s-num">79</div></div>
    <div class="s-cell"><div class="s-country">Haiti</div><div class="s-num">61</div></div>
    <div class="s-cell"><div class="s-country">Morocco</div><div class="s-num">32</div></div>
  </div>
</main>

<footer>
  <span class="f-left">Sabian Global Inc. · sabian.ai</span>
  <a class="f-mail" href="mailto:sabianglobal@gmail.com">sabianglobal@gmail.com</a>
</footer>

<script>
(async function() {
  try {
    var r = await fetch('/public-api/threats?limit=4');
    if (!r.ok) return;
    var d = await r.json();
    var list = (d.countries || []).slice(0, 4);
    if (list.length < 2) return;
    document.getElementById('scores').innerHTML = list.map(function(c) {
      return '<div class="s-cell"><div class="s-country">'+c.country+'</div><div class="s-num">'+c.convergence_score+'</div></div>';
    }).join('');
  } catch(e) {}
})();
</script>
</body>
</html>

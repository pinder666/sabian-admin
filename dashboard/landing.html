<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabian</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:  #050c1a;
      --edge:  #152040;
      --edge2: #1e2f50;
      --dim:   #8aa0c0;
      --text:  #c8d8f0;
      --mono: 'Courier New', Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    html, body { height: 100%; }

    body {
      background: var(--navy);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2.5rem;
      flex-shrink: 0;
    }

    .logo {
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-decoration: none;
      text-transform: uppercase;
      line-height: 1;
    }
    .logo .lg { color: #1a6fff; }
    .logo .lw { color: #ffffff; }

    .nav-entry {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--edge2);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-entry:hover { color: var(--dim); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 2.5rem;
      gap: 2.5rem;
    }

    .tagline {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .stats {
      display: flex;
      gap: 3.5rem;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .stat-n {
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .stat-l {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--edge2);
    }

    footer {
      padding: 1.5rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      flex-shrink: 0;
      border-top: 1px solid var(--edge);
    }

    .f-left {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--edge2);
    }

    .f-mail {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      color: var(--edge2);
      text-decoration: none;
      transition: color 0.2s;
    }
    .f-mail:hover { color: var(--dim); }

    @media (max-width: 600px) {
      nav, footer { padding: 1.25rem; }
      main { padding: 0 1.25rem; }
      .stats { gap: 2rem; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="/">
    <span class="lg">S</span><span class="lw">A</span><span class="lg">B</span><span class="lw">I</span><span class="lg">AN</span>
  </a>
  <a class="nav-entry" href="/terminal">Terminal →</a>
</nav>

<main>
  <p class="tagline">Continuous signal intelligence.</p>
  <div class="stats">
    <div class="stat">
      <span class="stat-n">217</span>
      <span class="stat-l">Countries</span>
    </div>
    <div class="stat">
      <span class="stat-n">20+</span>
      <span class="stat-l">Feeds</span>
    </div>
    <div class="stat">
      <span class="stat-n" id="days">—</span>
      <span class="stat-l">Days</span>
    </div>
  </div>
</main>

<footer>
  <span class="f-left">Sabian Global Inc. · sabian.ai</span>
  <a class="f-mail" href="mailto:sabianglobal@gmail.com">sabianglobal@gmail.com</a>
</footer>

<script>
  var el = document.getElementById('days');
  if (el) el.textContent = Math.max(0, Math.floor((Date.now() - new Date('2026-05-26').getTime()) / 86400000));
</script>
</body>
</html>
